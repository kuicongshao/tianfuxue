services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tianfu:tianfu@postgres-pgvector:5432/tianfu
      DATABASE_MODE: ${DATABASE_MODE:-json}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-fallback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NEWS_CACHE_WEEKS: ${NEWS_CACHE_WEEKS:-12}
      ENABLE_PAID_API: ${ENABLE_PAID_API:-false}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    depends_on:
      - postgres-pgvector

  postgres-pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tianfu
      POSTGRES_PASSWORD: tianfu
      POSTGRES_DB: tianfu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  postgres_data:
